    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raja Kolluru - Product Impact Infographic (Dark Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
        /* --- DARK MODE BASE STYLES --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1f2937;
            color: #f3f4f6; 
        }
        .stat-card {
            background-color: #374151; 
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: none; 
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .stat-card:hover {
            box-shadow: 0 0 20px rgba(0, 174, 239, 0.2);
            transform: translateY(-5px);
        }
        
        /* --- TIMELINE STYLES (CONCEPT 2) --- */
        .timeline-container {
            position: relative;
        }
        .timeline-container::before {
            content: '';
            position: absolute;
            top: 0;
            /* FIX: Ensure the line is inside the content area (clears 16px padding on mobile) */
            left: 20px; 
            width: 2px;
            height: 100%;
            background: #4b5563;
            z-index: 10;
        }
        .timeline-section {
            position: relative;
            /* FIX: Ensure padding is wide enough for the dot and line */
            padding-left: 55px; 
            margin-bottom: 3rem;
            transition: all 0.3s ease; 
        }
        .timeline-section:hover {
            box-shadow: 0 0 10px rgba(0, 174, 239, 0.3); 
        }
        .timeline-section::before {
            content: '';
            position: absolute;
            top: 10px;
            /* FIX: Center dot (15px wide) over the line (at 20px left) -> 20 - 7.5 = 12.5px */
            left: 12px; 
            width: 15px;
            height: 15px;
            background: #00AEEF;
            border-radius: 50%;
            border: 3px solid #1f2937;
            z-index: 20;
            /* Added accent glow */
            box-shadow: 0 0 5px #00AEEF; 
        }
        
        /* --- CHART STYLES (Rest unchanged) --- */
        .chart-container {
            position: relative;
            width: 100%;
            max-height: 50vh; 
            min-height: 250px; 
            height: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 350px;
                max-height: 450px;
            }
        }
        .flow-step {
            background-color: #374151;
            border: 2px solid #00AEEF;
            border-radius: 0.5rem;
            padding: 0.75rem;
            text-align: center;
            font-weight: 500;
            color: #f3f4f6;
            box-shadow: 0 4px 6px rgba(0, 174, 239, 0.1);
        }
        .flow-arrow {
            font-size: 1.5rem; 
            line-height: 1;
            color: #00AEEF;
            margin: 0.25rem 0;
        }
        @media (min-width: 768px) {
            .flow-arrow {
                font-size: 2rem;
            }
        }
        .icon-check {
            font-size: 2rem;
            line-height: 1;
        }
